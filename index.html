<!DOCTYPE html>
<html lang="be">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Беларуская літаратура - Галоўнае меню</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #f1c40f;
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .menu-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .menu-card {
            background-color: #34495e;
            border-radius: 15px;
            padding: 30px;
            width: 250px;
            text-decoration: none;
            color: white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.3s, background-color 0.3s;
            border-bottom: 5px solid #3498db;
        }
        .menu-card:hover {
            transform: translateY(-10px);
            background-color: #3d566e;
            border-bottom: 5px solid #f1c40f;
        }
        .menu-card h2 {
            margin-top: 0;
            color: #3498db;
        }
        .menu-card p {
            font-size: 0.9em;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <h1>Беларуская літаратура</h1>
    
    <div class="menu-container">
        <!-- Спасылка на Замак Альшанскі -->
        <a href="zamak.html" class="menu-card">
            <h2>Замок Альшанскі</h2>
            <p>Інтэрактыўная дошка па творы Уладзіміра Караткевіча.</p>
        </a>

        <!-- Спасылка на Знак Бяды -->
        <a href="znak.html" class="menu-card">
            <h2>Знак Бяды</h2>
            <p>Інтэрактыўная дошка па творы Васіля Быкава.</p>
        </a>
    </div>

</body>
</html>
